name: Rolling database release from minute RC

on:
  repository_dispatch:
    types: [min-candle-rc]
  workflow_dispatch:
    inputs:
      min_candle_sha:
        description: "Optional min-candle commit SHA; blank uses its main branch"
        required: false
        default: ""
        type: string
      force_release:
        description: "Confirm manual rolling release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: nse-database-rolling-release
  cancel-in-progress: false

env:
  RELEASE_TAG: nse-database-latest
  RELEASE_TITLE: Latest OLO NSE database
  RELEASE_VERSION: latest

jobs:
  release:
    if: github.event_name == 'repository_dispatch' || inputs.force_release
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository and source data
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Resolve and check out released minute-data commit
        id: source
        shell: pwsh
        env:
          DISPATCH_SHA: ${{ github.event.client_payload.min_candle_sha }}
          MANUAL_SHA: ${{ inputs.min_candle_sha }}
          SOURCE_MESSAGE: ${{ github.event.client_payload.commit_message }}
          SOURCE_RUN_URL: ${{ github.event.client_payload.source_run_url }}
        run: |
          $sha = if ($env:DISPATCH_SHA) { $env:DISPATCH_SHA.Trim() } else { $env:MANUAL_SHA.Trim() }
          if ($sha -and $sha -notmatch '^[0-9a-fA-F]{40}$') { throw "Invalid min-candle commit SHA: $sha" }

          git -C olo-testdata-nse-min-candle fetch origin main
          if ($LASTEXITCODE -ne 0) { throw "Fetching min-candle main failed." }
          if (-not $sha) {
            $sha = (git -C olo-testdata-nse-min-candle rev-parse origin/main).Trim()
          } else {
            git -C olo-testdata-nse-min-candle fetch origin $sha
            if ($LASTEXITCODE -ne 0) { throw "Fetching min-candle commit $sha failed." }
          }
          git -C olo-testdata-nse-min-candle checkout --detach $sha
          if ($LASTEXITCODE -ne 0) { throw "Checking out min-candle commit $sha failed." }
          $actual = (git -C olo-testdata-nse-min-candle rev-parse HEAD).Trim()
          if ($actual -ne $sha) { throw "Checked-out min-candle SHA does not match the requested SHA." }

          "sha=$sha" >> $env:GITHUB_OUTPUT
          "message=$($env:SOURCE_MESSAGE)" >> $env:GITHUB_OUTPUT
          "run_url=$($env:SOURCE_RUN_URL)" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: parquet_database/requirements.txt

      - name: Install database builder
        run: python -m pip install --disable-pip-version-check -r parquet_database/requirements.txt

      - name: Build and verify database from source
        run: |
          python parquet_database/fast_build_database.py --profile ci --refresh
          python parquet_database/fast_build_database.py --profile ci --verify-only

      - name: Assemble and split bounded release archives
        shell: bash
        run: |
          set -euo pipefail
          root="release/olo-testdata-nse-$RELEASE_VERSION"
          mkdir -p "$root/database"
          rsync -a database/ "$root/database/" \
            --exclude='_cache/' --exclude='_temp/' --exclude='_buckets_*/' \
            --exclude='_export_*/' --exclude='build.log' --exclude='*.tmp' \
            --exclude='*.tmp.parquet'
          cp -a olo-db-viewer "$root/olo-db-viewer"
          cp olo-db-viewer.bat LICENSE RELEASE_NOTES.md "$root/"
          python parquet_database/package_split_release.py release "$RELEASE_VERSION"

          find release -maxdepth 1 -type f \
            \( -name 'olo-testdata-nse-latest-*.zip' -o -name 'olo-testdata-nse-latest-split.sha256' \) \
            -print | sort > release/assets.txt
          test -s release/assets.txt
          while IFS= read -r asset; do
            test -s "$asset"
            test "$(stat -c%s "$asset")" -lt 2040109465
          done < release/assets.txt

      - name: Create or replace rolling pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag --force "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG" --force

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" \
              --notes-file RELEASE_NOTES.md --prerelease=true --latest=false
            mapfile -t old_assets < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            for asset in "${old_assets[@]}"; do
              gh release delete-asset "$RELEASE_TAG" "$asset" --yes
            done
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TITLE" \
              --notes-file RELEASE_NOTES.md --prerelease --latest=false
          fi

          mapfile -t assets < release/assets.txt
          gh release upload "$RELEASE_TAG" "${assets[@]}"
          expected=${#assets[@]}
          actual=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')
          test "$actual" -eq "$expected"
          gh release view "$RELEASE_TAG" --json url --jq '.url' > release/url.txt

      - name: Release summary
        shell: pwsh
        env:
          MINUTE_SHA: ${{ steps.source.outputs.sha }}
          RC_MESSAGE: ${{ steps.source.outputs.message }}
          SOURCE_RUN: ${{ steps.source.outputs.run_url }}
        run: |
          $url = Get-Content release/url.txt -Raw
          @"
          ## Rolling NSE database release

          - **Tag:** ``$env:RELEASE_TAG``
          - **Minute-data commit:** ``$env:MINUTE_SHA``
          - **RC commit message:** $env:RC_MESSAGE
          - **Source workflow:** $env:SOURCE_RUN
          - **Release:** $url
          "@ >> $env:GITHUB_STEP_SUMMARY

name: Manual database release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example V1.0.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: database-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish database bundle
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository and source data
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Update submodules to latest configured branches
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --remote --recursive
          git submodule status --recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: parquet_database/requirements.txt

      - name: Read and validate release version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:INPUT_VERSION.Trim()
          if ($version -notmatch '^[Vv][0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Version must use the form V1.0.0; got '$version'."
          }
          $version = "V" + $version.Substring(1)
          "version=$version" >> $env:GITHUB_OUTPUT
          "archive=olo-testdata-nse-$version.zip" >> $env:GITHUB_OUTPUT

      - name: Install database builder
        run: python -m pip install --disable-pip-version-check -r parquet_database/requirements.txt

      - name: Build database from source without reusing cache
        run: python parquet_database/fast_build_database.py --profile ci --refresh

      - name: Verify database
        run: python parquet_database/fast_build_database.py --profile ci --verify-only

      - name: Assemble consumer bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail
          root="release/olo-testdata-nse-$VERSION"
          mkdir -p "$root/database"

          rsync -a database/ "$root/database/" \
            --exclude='_cache/' \
            --exclude='_temp/' \
            --exclude='_buckets_*/' \
            --exclude='_export_*/' \
            --exclude='build.log' \
            --exclude='*.tmp' \
            --exclude='*.tmp.parquet'
          cp -a olo-db-viewer "$root/olo-db-viewer"
          cp olo-db-viewer.bat LICENSE RELEASE_NOTES.md "$root/"

          (cd release && zip -q -r -9 "$ARCHIVE" "olo-testdata-nse-$VERSION")
          sha256sum "release/$ARCHIVE" > "release/$ARCHIVE.sha256"

      - name: Create or replace GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail

          git tag --force "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION" --force

          created=false
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Replacing existing release $VERSION."
            gh release edit "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --title "OLO NSE database $VERSION" \
              --notes-file RELEASE_NOTES.md

            mapfile -t old_assets < <(
              gh release view "$VERSION" \
                --repo "$GITHUB_REPOSITORY" \
                --json assets \
                --jq '.assets[].name'
            )
            for asset in "${old_assets[@]}"; do
              gh release delete-asset "$VERSION" "$asset" \
                --repo "$GITHUB_REPOSITORY" --yes
            done
          else
            gh release create "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --title "OLO NSE database $VERSION" \
              --notes-file RELEASE_NOTES.md \
              --draft
            created=true
          fi

          cleanup_new_release() {
            if [ "$created" = true ]; then
              gh release delete "$VERSION" --repo "$GITHUB_REPOSITORY" \
                --yes >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_new_release ERR

          if gh release upload "$VERSION" \
            "release/$ARCHIVE" "release/$ARCHIVE.sha256" \
            --repo "$GITHUB_REPOSITORY"; then
            echo "Published the database as one ZIP."
          else
            echo "Single ZIP upload failed; creating separate daily and minute archives."
            gh release delete-asset "$VERSION" "$ARCHIVE" \
              --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true
            gh release delete-asset "$VERSION" "$ARCHIVE.sha256" \
              --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true

            python parquet_database/package_split_release.py release "$VERSION"
            mapfile -t split_assets < <(find release -maxdepth 1 -type f \
              \( -name "olo-testdata-nse-$VERSION-daily.zip" \
                 -o -name "olo-testdata-nse-$VERSION-minute-*.zip" \
                 -o -name "olo-testdata-nse-$VERSION-minute.zip" \
                 -o -name "olo-testdata-nse-$VERSION-split.sha256" \) \
              -print | sort)
            gh release upload "$VERSION" "${split_assets[@]}" --repo "$GITHUB_REPOSITORY"
          fi

          gh release edit "$VERSION" --draft=false --repo "$GITHUB_REPOSITORY"
          trap - ERR
